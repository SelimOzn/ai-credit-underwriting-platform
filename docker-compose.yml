version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: credit_ai_backend
    ports:
      - "8000:8000"
    volumes:
      - "./data:/app/data"
    environment:
      - OLLAMA_HOST=http://${OLLAMA_IP}:11434

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: credit_ai_frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000
      - PYTHONPATH=/app




