version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: credit_ai_backend
    ports:
      - "8000:8000"
    volumes:
      - "./data:/app/data"
      - "./scoring_models:/app/scoring_models"
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: credit_ai_frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000
      - PYTHONPATH=/app

volumes:
  ollama_data:



